services:
  postgres:
    image: postgres:17
    container_name: agendamento-fotografia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agendamento_fotografia}
      POSTGRES_USER: ${DB_USER:-agendamento_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeit}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - agendamento_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agendamento_app} -d ${DB_NAME:-agendamento_fotografia}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agendamento_pgdata:
