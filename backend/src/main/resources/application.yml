spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: agendamento-fotografia-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agendamento_fotografia}
    username: ${DB_USER:agendamento_app}
    password: ${DB_PASSWORD:changeit}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scheduling
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: scheduling,authentication,public
    default-schema: public
    create-schemas: false

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: authentication.spring_session
    timeout: 60m

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
